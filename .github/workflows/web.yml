name: Web

on:
  push:
    tags:
      - "web/v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos-exe:
    name: Build macOS exe
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${version}" == web/* ]]; then
            version="${version#web/}"
          else
            version="${version//\//-}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=aidetector-web-osx-${version}" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: pnpm install

      - name: Stage FFmpeg static asset
        run: |
          ffmpegPath=$(node -e "const ffmpegPath = require('ffmpeg-static'); if (!ffmpegPath) { throw new Error('ffmpeg-static did not resolve a binary path'); } process.stdout.write(ffmpegPath);")
          if [ ! -f "$ffmpegPath" ]; then
            echo "ffmpeg-static binary path does not exist: $ffmpegPath" >&2
            exit 1
          fi

          mkdir -p static/_internal
          cp "$ffmpegPath" static/_internal/ffmpeg
          chmod +x static/_internal/ffmpeg

          if [ ! -s static/_internal/ffmpeg ]; then
            echo "Copied ffmpeg is empty: static/_internal/ffmpeg" >&2
            exit 1
          fi

          echo "FFmpeg asset staged at static/_internal/ffmpeg ($(wc -c < static/_internal/ffmpeg) bytes)"

      - name: Build
        env:
          AI_DETECTOR_WEB_TARGET: darwin-arm64
          AI_DETECTOR_WEB_VERSION: ${{ github.ref_name }}
        run: pnpm run build

      - name: Name Executable
        run: |
          mv "dist/ai-detector-web" "dist/${ARTIFACT_NAME}.command"

      - name: Zip Executable
        run: |
          cd dist
          chmod +x "${ARTIFACT_NAME}.command"
          ditto -c -k "${ARTIFACT_NAME}.command" "${ARTIFACT_NAME}.zip"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: aidetector-web-osx-${{ steps.version.outputs.version }}-exe
          path: web/dist/aidetector-web-osx-${{ steps.version.outputs.version }}.zip

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Web ${{ steps.version.outputs.version }}
          make_latest: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: web/dist/aidetector-web-osx-${{ steps.version.outputs.version }}.zip
