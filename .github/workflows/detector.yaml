name: Detector

on:
  push:
    tags:
      - "detector/v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  PYINSTALLER_ARGS: --onefile --hidden-import ultralytics --collect-all litellm --collect-all onnxruntime --collect-all onnx --hidden-import=tiktoken_ext.openai_public --hidden-import=tiktoken_ext --paths src --clean --noconfirm
  VERSION_FILE: src/aidetector/utils/version.py

jobs:
  macos-default-exe:
    name: MacOS Default Executable
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${version}" == detector/* ]]; then
            version="${version#detector/}"
          else
            version="${version//\//-}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=aidetector-osx-${version}" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build Executable
        run: |
          echo 'TYPE = "default"' > ${{ env.VERSION_FILE }}
          echo 'REF_NAME = "${{ github.ref_name }}"' >> ${{ env.VERSION_FILE }}
          uv run --extra default pyinstaller src/aidetector/__init__.py --name "${ARTIFACT_NAME}.command" ${{ env.PYINSTALLER_ARGS }}

      # macOS asks for local network access per signing identifier, and
      # PyInstaller takes it from the file name, which holds the version: every
      # release asked again, and the detector saw no camera until someone
      # clicked Allow on the Mac mini. One identifier for all versions keeps it.
      - name: Fixed signing identifier
        run: |
          codesign --force --sign - --identifier nl.cowcatcher.aidetector "dist/${ARTIFACT_NAME}.command"
          codesign --verify --strict "dist/${ARTIFACT_NAME}.command"

      - name: Zip Executable
        run: |
          cd dist
          chmod +x "${ARTIFACT_NAME}.command"
          ditto -c -k "${ARTIFACT_NAME}.command" "${ARTIFACT_NAME}.zip"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: aidetector-osx-${{ steps.version.outputs.version }}-exe
          path: detector/dist/aidetector-osx-${{ steps.version.outputs.version }}.zip

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/detector/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Detector ${{ steps.version.outputs.version }}
          make_latest: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            detector/dist/aidetector-osx-${{ steps.version.outputs.version }}.zip
            macos/cowcatcher.sh
